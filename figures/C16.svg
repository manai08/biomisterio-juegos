<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 255" role="img"><rect width="1000" height="255" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#173e49"><text x="40" y="80" text-anchor="middle" font-size="27" font-weight="bold">I</text><text x="540" y="80" text-anchor="middle" font-size="31" font-weight="normal">glucosa + glucosa → maltosa + agua</text><text x="40" y="200" text-anchor="middle" font-size="27" font-weight="bold">II</text><text x="540" y="200" text-anchor="middle" font-size="31" font-weight="normal">maltosa + agua → glucosa + glucosa</text></g></svg>